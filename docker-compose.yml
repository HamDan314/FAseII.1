services:
  backend:
    build:
      context: ./backend
    container_name: cancer-api
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cancer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
